name: Trivy licensscan og SBOM

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  license-scan:
    name: Licenspolitik + SBOM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Installer Trivy fra officielt apt-repo
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget -qO- https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy
          trivy --version

      # GATE: fejler ved forbudte (CRITICAL) og stærkt begrænsede (HIGH) licenser
      - name: Håndhæv licenspolitik
        run: |
          trivy fs \
            --config trivy.yaml \
            --scanners license \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            .

      # Informativ scan med ALT indhold (også lav-severitet) — fejler aldrig
      - name: Informativ licensscan (log-output)
        if: always()   # kører selv hvis policysteppen fejlede
        run: |
          trivy fs --scanners license --exit-code 0 .

      - name: Generér SBOM i SPDX-format
        if: always()
        run: |
          trivy fs --format spdx-json --output sbom.spdx.json --scanners license .

      - name: Generér SBOM i CycloneDX-format
        if: always()
        run: |
          trivy fs --format cyclonedx --output sbom.cdx.json .

      - name: Upload SBOM'er som artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom.spdx.json
            sbom.cdx.json
          retention-days: 90

