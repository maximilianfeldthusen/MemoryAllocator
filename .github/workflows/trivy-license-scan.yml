name: Trivy licens- og afhængighedsscanning

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Kør hver mandag kl. 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:   # gør det muligt at starte manuelt fra GitHub UI

permissions:
  contents: read

jobs:
  license-scan:
    name: Scann licenser og sårbarheder
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Installer Trivy fra officielt apt-repo
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget -qO- https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy
          trivy --version

      - name: Scann licenser (output i loggen)
        run: |
          # --exit-code 0 => workflowet fejler IKKE selv ved fund;
          # ret til 1, hvis du vil have build til at fejle på fund
          trivy fs \
            --scanners license \
            --exit-code 0 \
            .

      # Vil du også scanne for sårbarheder og secrets, så ændr linjen til:
      #   trivy fs --scanners vuln,license,secret --exit-code 1 .
      # (med --exit-code 1 fejler jobbet, hvis der findes kritiske fund
